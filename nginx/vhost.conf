server {
    listen 80;
    listen [::]:80;
    server_name default_replace_8888;
    # 允许 Let's Encrypt 验证路径
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /wwwroot/default_replace_8888;
        try_files $uri =404;
    }
    # 重定向到 https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name default_replace_8888;
    index index.php index.html index.htm;
    root /wwwroot/default_replace_8888;

    # ssl-cert-start
    #ssl_certificate    /letsencrypt/live/default_replace_8888/fullchain.pem;
    #ssl_certificate_key    /letsencrypt/live/default_replace_8888/privkey.pem;
    # ssl-cert-end

    # 限制请求频率
    limit_req zone=wordpress_req burst=100 nodelay;
    # 限制连接数
    # limit_conn wordpress_conn 100;
    # 限制下载速度
    # limit_rate 10m;
    # 限制请求频率
    # limit_req zone=wordpress burst=100 nodelay;
    # 针对WordPress的特定限速
    # limit_rate 1m;  # 对WordPress动态内容限制为1MB/s

    # 设置是否跳过缓存
    set $skip_cache 0;

    # 禁止以 . 开头的隐藏文件（但排除上面路径）
    location ~ (^|/)\. {
        deny all;
    }
    # 安全规则
    location ~* ^/wp-(content|includes)/.*\.(txt|log|md|php|py|sh|rb|pl|cgi|asp|aspx|jsp|fcgi|action|do|php3|php4|php5|php7|phtml|shtml|ini|conf)$ {
        deny all;
    }
    # 禁止访问敏感文件
    location ~ ^/(LICENSE|README.md|wp-config-sample.php|xmlrpc.php|wp-config.php) {
        deny all;
    }
    # WordPress 核心规则
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    # WordPress 固定链接重写规则
    rewrite /wp-admin$ $scheme://$host$uri/ permanent;

    # WordPress 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|webp|avif)$ {
        expires 30d;
    }

    # 如果请求头包含 "Cache-Control: no-cache"，则跳过缓存
    # if ($http_cache_control ~* "no-cache") {
    #     set $skip_cache 1;
    # }
    # POST请求不缓存
    if ($request_method = POST) {
        set $skip_cache 1;
    }
    # 查询字符串不缓存
    if ($query_string != "") {
        set $skip_cache 1;
    }
    # 后台等特定页面不缓存（其他需求请自行添加即可）
    if ($request_uri ~* "^/wp-admin/|^/cart|^/checkout|^/my-account|^/feed|^/sitemap|^/xmlrpc.php$|^/wp-.*.php$|index.php") {
        set $skip_cache 1;
    }
    # 对登录用户、评论过的用户不展示缓存
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }

    # PHP 处理
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 缓存控制
        fastcgi_cache wordpress;  #定义缓存区域
        fastcgi_cache_bypass $skip_cache; 
        fastcgi_no_cache $skip_cache;
        add_header X-FastCGI-Cache $upstream_cache_status; # 命中缓存状态
        # 安全headers
        add_header X-XSS-Protection "1; mode=block" always;
        # 强制浏览器严格遵守Content-Type标头中声明的文件类型, 禁止 "嗅探" 猜测文件类型
        add_header X-Content-Type-Options "nosniff" always;
        # 自动跳转https
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # 控制浏览器在跳转到其他网站时 ​​如何发送Referer头​​, 防止敏感信息泄露 如 URL 中的用户 Token
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 控制浏览器在加载资源时如何处理内容类型不匹配的情况 
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:;" always;
    }
    # 清理缓存
    location ~ /purge(/.*) {
        fastcgi_cache_purge wordpress "$scheme$request_method$host$1";
        # fastcgi_cache_purge wordpress "$scheme$request_method$host$request_uri";
    }

    # WordPress 专用日志
    error_log /usr/local/nginx/logs/default_replace_8888.error.log crit;
    # access_log /usr/local/nginx/logs/default_replace_8888.access.log main;
}